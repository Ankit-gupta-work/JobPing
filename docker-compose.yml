services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - Jwt__SecretKey=${JWT_SECRET}
      - Jwt__Issuer=jobping-api
      - Jwt__Audience=jobping-client
      - Jwt__AccessTokenExpiryMinutes=15
      - Redis__ConnectionString=redis:6379
      - Redis__Password=${REDIS_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - SendGrid__ApiKey=${SENDGRID_API_KEY}
      - Adzuna__AppId=${ADZUNA_APP_ID}
      - Adzuna__AppKey=${ADZUNA_APP_KEY}
      - JSearch__ApiKey=${JSEARCH_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RUN_MODE=worker
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - Jwt__SecretKey=${JWT_SECRET}
      - Redis__ConnectionString=redis:6379
      - Redis__Password=${REDIS_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - SendGrid__ApiKey=${SENDGRID_API_KEY}
      - Adzuna__AppId=${ADZUNA_APP_ID}
      - Adzuna__AppKey=${ADZUNA_APP_KEY}
      - JSearch__ApiKey=${JSEARCH_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jobping
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Host access for running `dotnet ef database update` (Production never
      # auto-migrates — see Program.cs). Non-standard host port so it doesn't
      # collide with a local native Postgres install.
      #
      # PRODUCTION WARNING: this maps the port on the HOST, but the host is a
      # real public server once deployed (Step 9). Binding here is harmless
      # BY ITSELF only as long as you never open 5433 in the cloud firewall
      # (Oracle Cloud: the VCN Security List) — see docs/DEPLOYMENT.md. Do
      # not add a security-list rule for this port. Same goes for RabbitMQ's
      # 15672 below.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d jobping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      # Management UI — dev convenience only. Same production warning as
      # db's port above: fine bound to the host, just never open 15672 in
      # the cloud firewall. Use an SSH tunnel if you need this UI on a
      # real server (`ssh -L 15672:localhost:15672 you@server`).
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Falls back to localhost for local `docker compose up` — only needs
      # to be the real domain in the deployed .env. Also used by nginx's
      # server_name once you swap in the HTTPS template (see
      # docs/DEPLOYMENT.md).
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

  # Issues and renews the Let's Encrypt certificate. Not started by `docker
  # compose up -d` on its own (no long-running command below) — it's run
  # on demand via `docker compose run --rm certbot ...`, see
  # docs/DEPLOYMENT.md "Get a TLS certificate". Renewal is a cron job on
  # the host calling the same image, documented there too.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  certbot_www:
  certbot_conf:
