events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream api {
    server api:80;
  }

  server {
    listen 80;
    server_name _;

    # API — proxied to the api container. No TLS here yet: jobping.dev isn't live
    # (Step 9), so there's no real certificate to terminate against. Once a domain +
    # cert exist, add the 80→443 redirect and SSL server block from CLAUDE.md §14 here.
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
      proxy_pass http://api;
    }

    # Angular static files (SPA fallback to index.html for client-side routing)
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
