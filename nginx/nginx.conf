events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # The real server blocks live in /etc/nginx/conf.d/ — generated at container
  # startup from nginx/templates/*.template via envsubst (built into the
  # official nginx:alpine entrypoint, no custom scripting needed). This lets
  # the same image serve plain HTTP locally (DOMAIN=localhost) and real HTTPS
  # in production (DOMAIN=jobping.dev, or whatever you point at the server)
  # without maintaining two Dockerfiles.
  include /etc/nginx/conf.d/*.conf;
}
